  /* /* --- DARK THEME --- */
body {
    margin: 0; padding: 0;
    background-color: #131314; /* Pura Black */
    color: #E3E3E3;
    font-family: sans-serif;
    display: flex; flex-direction: column;
    height: 100vh;
}

/* Top Bar */
.top-bar {
    padding: 15px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
    background: #131314;
}
.menu-btn { font-size: 22px; cursor: pointer; }
.login-btn { background: #333; padding: 5px 15px; border-radius: 20px; font-size: 14px; }

/* Chat Area */
#messageArea {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
    padding-bottom: 100px;
}

/* User Message (Right - Dark Box) */
.user-message {
    align-self: flex-end;
    background-color: #282a2c;
    color: #fff;
    padding: 12px 18px;
    border-radius: 20px 20px 4px 20px;
    max-width: 80%;
    font-size: 16px;
}

/* AI Message (Left - TRANSPARENT/NO BOX) */
.ai-message {
    align-self: flex-start;
    background: transparent; /* Box hata diya */
    color: #E3E3E3;
    padding: 0;
    margin-left: 5px;
    max-width: 95%;
    font-size: 16px;
    line-height: 1.5;
}

/* Welcome Screen */
#welcomeScreen {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; width: 90%;
    display: flex; flex-direction: column; gap: 20px;
}
.grid-container {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.grid-item {
    background: #1E1F20; padding: 15px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 14px; border: 1px solid #333;
}

/* --- BOTTOM BAR --- */
.input-container {
    position: fixed; bottom: 0; left: 0; width: 100%;
    padding: 10px 15px;
    background: #1E1F20; /* Grey Bar */
    display: flex; align-items: center; gap: 10px;
    border-radius: 30px 30px 0 0;
    margin-bottom: 10px; width: 95%; left: 2.5%; /* Hawa me tairta hua */
}

/* Gol Buttons (+, Globe, Mic) */
.icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #2C2C2C; /* Dark Grey */
    border: none; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
}

/* Input Field */
#userInput {
    flex: 1; background: transparent; border: none;
    color: white; font-size: 16px; outline: none; padding: 10px;
}

/* Send Button (Default: Dark) */
#sendBtn {
    width: 45px; height: 45px; border-radius: 50%;
    background: #2C2C2C; /* Pehle Dark rahega */
    border: none; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
}

/* Jab Type karenge tab ye White ho jayega */
#sendBtn.active {
    background: #FFFFFF; /* Pura White */
    color: #000000; /* Arrow Black */
 }
   * Sidebar (Menu) */
    #sidebar {
        position: fixed; left: -250px; top: 0; width: 250px; height: 100%;
        background: #1E1F20; transition: 0.3s; z-index: 1000; padding: 20px;
    }
    #sidebar.active { left: 0; }

        position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    #overlay.active { display: block; }}

}
/* --- Footer & Plus Menu --- */
        .footer-area { position: fixed; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 15px; z-index: 1000; }
        .chat-card { width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 28px; padding: 15px; border: 1px solid #333; }
        textarea { width: 100%; border: none; background: transparent; outline: none; font-size: 1.1rem; resize: none; color: #e0e0e0; min-height: 25px; }
        
        .chat-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .plus-btn-circle, .web-search-btn { width: 40px; height: 40px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #555; }
        .web-search-btn.active { color: #00ccff; border-color: #00ccff; box-shadow: 0 0 10px rgba(0, 204, 255, 0.4); }
        .send-arrow { width: 40px; height: 40px; background: #333; border: none; border-radius: 50%; color: #fff; cursor: pointer; }

        .plus-menu { display: none; position: absolute; bottom: 85px; left: 20px; width: 185px; background: #1e1e1e; border-radius: 20px; border: 1px solid #333; padding: 8px; z-index: 2001; }
        .plus-menu.active { display: block; animation: popUp 0.2s ease-out; }
        .menu-item { padding: 12px; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; cursor: pointer; border-radius: 12px; }

        /* --- Premium Login Modal --- */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 20000; backdrop-filter: blur(8px); }
        .login-overlay.active { display: flex; }
        .login-box { background: #1e1e1e; width: 90%; max-width: 380px; padding: 40px 30px; border-radius: 30px; border: 1px solid #333; text-align: center; position: relative; }
        .social-btn { width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 50px; border: 1px solid #333; background: #222; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        @keyframes popUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    <script>
      / --- 1. SAARE ELEMENTS LAO ---
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const menuToggle = document.getElementById("menuToggle");
    
    // Input Area Elements
    const sendBtn = document.getElementById("sendBtn");
    const userInput = document.getElementById("userInput");
    const chatArea = document.getElementById("messageArea");
    const welcomeScreen = document.getElementById("welcomeScreen");
    
    // Buttons
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const webBtn = document.getElementById("webBtn");
    const inputContextArea = document.getElementById("inputContextArea");

    // --- 2. VARIABLES (Yaadasht) ---
    let isImageMode = false;  // Kya image banani hai?
    let isWebSearch = false;  // Kya internet se dhundna hai?
    let selectedFile = null;  // Kya koi photo hai?

    // --- 3. MENU / SIDEBAR ---
    function toggleMenu() {
        if(sidebar) sidebar.classList.toggle("active");
        if(overlay) overlay.classList.toggle("active");
    }
    if(menuToggle) menuToggle.addEventListener("click", toggleMenu);
    if(overlay) overlay.addEventListener("click", toggleMenu);

    // --- 4. FEATURE BUTTONS (Welcome Screen Logic) ---
    // (HTML me onclick="handleFeature('...')" hona chahiye)
    window.handleFeature = function(type) {
        // Sabse pehle Welcome Screen Hatao
        if(welcomeScreen) welcomeScreen.style.display = "none";
        if(chatArea) chatArea.style.display = "flex";

        if (type === 'image') {
            activateImageMode();
            addMessage("AI", "🎨 **Image Mode On!**<br>Kaisi photo chahiye? Prompt likho...");
        } 
        else if (type === 'location') {
            addMessage("You", "Meri Location batao 📍");
             if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    sendMessageToServer(`My Location: Lat ${position.coords.latitude}, Lon ${position.coords.longitude}. Where am I?`, "chat");
                }, () => addMessage("AI", "Permission denied! 🔴"));
            }
        }
        else if (type === 'code') {
            addMessage("AI", "Code bhejo Guru, main debug karta hoon! 💻");
        }
        else {
            addMessage("AI", "Ye feature jald aayega! 🛠️");
        }
    }

    // --- 5. INPUT & MODES ---
    
    // A. Plus Button (Upload)
    if(uploadBtn) {
        uploadBtn.addEventListener("click", () => fileInput.click());
    }
    // File Select Hone Par
    if(fileInput) {
        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if(!file) return;
            selectedFile = file;
            
            // Preview Dikhao
            inputContextArea.style.display = "block";
            inputContextArea.innerHTML = `
                <div style="background: #333; padding: 5px; border-radius: 10px; display: inline-block;">
                    <img src="${URL.createObjectURL(file)}" style="height: 50px; border-radius: 5px;">
                    <span onclick="clearContext()" style="color: red; cursor: pointer; margin-left: 5px;">✖</span>
                </div>`;
        });
    }

    // B. Globe Button (Web Search)
    if(webBtn) {
        webBtn.addEventListener("click", () => {
            isWebSearch = !isWebSearch; // Toggle ON/OFF
            webBtn.style.color = isWebSearch ? "#4facfe" : "white"; // Blue if ON
            if(isWebSearch) {
                 addMessage("AI", "🌐 Web Search: <b>ON</b>");
            } else {
                 addMessage("AI", "🌐 Web Search: <b>OFF</b>");
            }
        });
    }

    // C. Image Mode Logic
    function activateImageMode() {
        isImageMode = true;
        inputContextArea.style.display = "block";
        inputContextArea.innerHTML = `
            <div style="background: #cce5ff; color: #004085; padding: 5px 10px; border-radius: 15px; font-size: 13px; display: inline-block;">
                ✨ Image Gen Mode <span onclick="clearContext()" style="cursor: pointer; margin-left: 5px;">✖</span>
            </div>`;
    }

    // D. Clear Everything (Cross dabane par)
    window.clearContext = function() {
        isImageMode = false;
        selectedFile = null;
        inputContextArea.style.display = "none";
        inputContextArea.innerHTML = "";
        fileInput.value = "";
    }

    // E. Input Resize & Button Color
    userInput.addEventListener("input", function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if (this.value.trim().length > 0) sendBtn.classList.add("active");
        else sendBtn.classList.remove("active");
    });

    // --- 6. SEND MESSAGE LOGIC (Sabse Zaruri) ---
    async function sendMessage() {
        const msg = userInput.value.trim();
        if (!msg && !selectedFile) return;

        // 1. UI SAFAYI: Welcome screen hatao
        if(welcomeScreen) welcomeScreen.style.display = "none";
        if(chatArea) chatArea.style.display = "flex";

        // 2. Message Dikhao
        if (selectedFile) addMessage("You", `[🖼️ Photo] ${msg}`);
        else addMessage("You", msg);

        // 3. Input Reset
        userInput.value = "";
        userInput.style.height = 'auto';
        sendBtn.classList.remove("active");

        // 4. Check Mode
        let type = "chat";
        if (isImageMode && !selectedFile) {
            type = "image_gen";
            addMessage("AI", "🎨 Painting shuru... (Wait karo)");
        }

        // 5. Server Call
        await sendMessageToServer(msg, type);

        // 6. Reset Mode
        if(isImageMode) clearContext();
    }

    // --- 7. SERVER SE BAAT ---
    async function sendMessageToServer(msg, type) {
        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg, type: type })
            });

            const data = await res.json();

            if (data.image) {
                const imgHTML = `<img src="${data.image}" style="width: 100%; border-radius: 10px; margin-top: 10px;">`;
                addMessage("AI", data.reply + "<br>" + imgHTML);
            } else {
                addMessage("AI", data.reply);
            }
        } catch (error) {
            addMessage("AI", "Guru, Internet Problem! 🔴");
        }
    }

    // --- 8. HELPER (Message Dikhana) ---
    function addMessage(sender, text) {
        const div = document.createElement("div");
        div.className = sender === "You" ? "user-message" : "ai-message";
        div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    // --- 9. CLICK LISTENERS ---
    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });        
 </script>
