<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeeshu AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: sans-serif; background: #000; color: white; display: flex; flex-direction: column; height: 100vh; }
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .user { align-self: flex-end; background: #007bff; padding: 12px; border-radius: 15px; max-width: 80%; }
        .ai { align-self: flex-start; background: #222; padding: 12px; border-radius: 15px; border: 1px solid #444; max-width: 85%; }
        .input-box { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        textarea { flex: 1; background: #333; color: white; border: none; padding: 12px; border-radius: 20px; height: 40px; outline: none; }
        .send-btn { color: #007bff; font-size: 25px; cursor: pointer; align-self: center; }
    </style>
</head>
<body>
    <div class="chat-area" id="chat">
        <h2 style="text-align: center; color: #666;">Jeeshu AI Active</h2>
    </div>
    <div class="input-box">
        <textarea id="userInput" placeholder="Ask Jeeshu..."></textarea>
        <i class="fas fa-paper-plane send-btn" onclick="askAI()"></i>
    </div>

    <script>
        const KEY = "AIzaSyD6CyqWFrW1aCGDxeoVWJ4ZFfe5c69aHNg";
        async function askAI() {
            const input = document.getElementById("userInput");
            const msg = input.value.trim();
            if (!msg) return;

            const chat = document.getElementById("chat");
            chat.innerHTML += `<div class="user">${msg}</div>`;
            input.value = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: msg }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="ai">${reply}</div>`;
            } catch (e) { chat.innerHTML += `<div class="ai">Error Connecting!</div>`; }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
