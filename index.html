    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Jeeshu AI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  background:#121212;
  color:#e0e0e0;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

/* ===== HEADER ===== */
.top-nav{
  height:60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
}
.login-btn{
  background:#333;
  color:#fff;
  border:none;
  padding:8px 18px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}

/* ===== MAIN ===== */
.content{
  padding:40px 0 160px;
  text-align:center;
}
.feature-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  width:90%;
  max-width:500px;
  margin:30px auto;
}
.card{
  background:#1e1e1e;
  border:1px solid #333;
  border-radius:22px;
  padding:18px;
}

/* ===== CHAT ===== */
.footer-area{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
}
.chat-card{
  width:90%;
  max-width:600px;
  background:#1e1e1e;
  border-radius:28px;
  padding:15px;
  border:1px solid #333;
}
textarea{
  width:100%;
  background:none;
  border:none;
  color:#fff;
  resize:none;
  outline:none;
}
.chat-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}
.circle{
  width:40px;height:40px;
  background:#333;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

/* ===== LOGIN MODAL ===== */
.login-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.login-overlay.active{display:flex}
.login-box{
  width:90%;
  max-width:380px;
  background:#1e1e1e;
  border-radius:30px;
  padding:40px 30px;
  border:1px solid #333;
  text-align:center;
  position:relative;
}
.social-btn{
  width:100%;
  padding:13px;
  border-radius:50px;
  background:#222;
  border:1px solid #333;
  color:#fff;
  margin-bottom:12px;
  cursor:pointer;
}
.close{
  position:absolute;
  top:15px;
  right:20px;
  font-size:26px;
  cursor:pointer;
  color:#777;
}
</style>
</head>

<body>

<header class="top-nav">
  <div><b>Jeeshu AI</b></div>
  <button class="login-btn" id="openLogin">Login</button>
</header>

<main class="content">
  <h1>Welcome To Jeeshu AI</h1>

  <div class="feature-box">
    <div class="card">✨ Image Generate</div>
    <div class="card">🖼️ Image Enhance</div>
    <div class="card">📍 Location</div>
    <div class="card">🧠 Code Debug</div>
  </div>
</main>

<div class="footer-area">
  <div class="chat-card">
    <textarea placeholder="Message Jeeshu AI..."></textarea>
    <div class="chat-bottom">
      <div class="circle"><i class="fa fa-plus"></i></div>
      <div style="display:flex;gap:10px">
        <i class="fa fa-microphone"></i>
        <div class="circle"><i class="fa fa-arrow-up"></i></div>
      </div>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div class="login-overlay" id="loginBox">
  <div class="login-box">
    <div class="close" id="closeLogin">&times;</div>

    <img src="https://raw.githubusercontent.com/JeeshuAI/assets/main/logo.png"
         style="width:70px;border-radius:16px;margin-bottom:15px">

    <h2>Jeeshu AI</h2>
    <p style="color:#888;font-size:14px;margin-bottom:25px">
      Your Smart AI Companion
    </p>

    <button class="social-btn" id="googleLogin">
      <i class="fab fa-google"></i> Continue with Google
    </button>
    <button class="social-btn">
      <i class="fab fa-apple"></i> Continue with Apple
    </button>
    <button class="social-btn">
      <i class="fa fa-envelope"></i> Continue with Email
    </button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAz5Ki2f0z_6VwumqQDnYKpByDi9FsrjD4",
  authDomain: "jeeshu-ai-f2673.firebaseapp.com",
  projectId: "jeeshu-ai-f2673",
  storageBucket: "jeeshu-ai-f2673.firebasestorage.app",
  messagingSenderId: "721216244975",
  appId: "1:721216244975:web:d9e5dcb96ada3339981f1a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBox = document.getElementById("loginBox");

document.getElementById("openLogin").onclick=()=>loginBox.classList.add("active");
document.getElementById("closeLogin").onclick=()=>loginBox.classList.remove("active");

document.getElementById("googleLogin").onclick=()=>{
  signInWithPopup(auth,provider)
    .then(()=>loginBox.classList.remove("active"))
    .catch(e=>alert(e.message));
};
</script>

</body>
</html>
